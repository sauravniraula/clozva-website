name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clozva
          POSTGRES_PASSWORD: clozva-ci-test
          POSTGRES_DB: clozva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clozva -d clozva"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://clozva:clozva-ci-test@127.0.0.1:5432/clozva
      - run: npm run typecheck
      - name: Build Netlify Functions and static assets
        run: npm run build
        env:
          NITRO_PRESET: netlify
      - run: node scripts/check-netlify.mjs
        env:
          TEST_DATABASE_URL: postgres://clozva:clozva-ci-test@127.0.0.1:5432/clozva